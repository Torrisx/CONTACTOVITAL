        fr.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("El archivo no es una imagen válida."));

            const k = Math.min(1, max / Math.max(img.width, img.height));

    // Ejecuta una operación como transacción atómica (Firestore) o de forma local.
    async function runOp(fn) {
      const staged = [];
      try {
        if (cloudConfigured && !cloudOn()) await Promise.race([cloudReady, new Promise((r) => setTimeout(r, 4000))]);
        let result;
        if (cloudOn()) {
          result = await runTransaction(dbInstance, async (t) => {

              get: async (col, id) => {

                if (s.exists()) return { ...s.data(), id: s.id };
                if (col === "advisors") return readList("advisors").find((o) => String(o.id) === String(id)) || null;
                return null;

              set: (col, id, data) => { t.set(sharedDoc(col, id), { ...data, id }, { merge: true }); staged.push([col, id, { ...data, id }]); },
            };

            get: async (col, id) => readList(col).find((o) => String(o.id) === String(id)) || null,
            set: (col, id, data) => { staged.push([col, id, { ...data, id }]); },

        applyStaged(staged);

    const mkAudit = (s, action, targetId, details, now) => ({ id: generateId("aud"), action, actorId: s.id, actorName: s.name, actorRole: s.accountType === "admin" ? "Administrador" : "Asesor", targetId: String(targetId || ""), details: String(details || ""), createdAt: now });

      const nexts = NEXT_STATUS[o.status].filter((s) => s !== "RECHAZADO");
      openModal(`
        <div class="flex items-center justify-between"><h3 class="text-base font-extrabold text-white">Detalle del pedido</h3>${statusChip(o.status)}</div>
        <dl class="mt-4 text-sm grid grid-cols-[auto_1fr] gap-x-4 gap-y-1.5">
          <dt class="text-slate-400">Asesor</dt><dd class="text-white font-semibold">${escapeHtml(o.advisorName)}</dd>
          <dt class="text-slate-400">Grupo</dt><dd>${escapeHtml(o.advisorGroup || "—")}</dd>
          <dt class="text-slate-400">Producto</dt><dd class="text-white font-semibold">${escapeHtml(o.productName)}</dd>
          <dt class="text-slate-400">Monedas</dt><dd class="text-emerald-300 font-bold">${escapeHtml(formatVc(o.costVc))}</dd>
          <dt class="text-slate-400">Fecha</dt><dd>${escapeHtml(fmtDate(o.createdAt))}</dd>
          <dt class="text-slate-400">Hora</dt><dd>${escapeHtml(fmtTime(o.createdAt))}</dd>
          <dt class="text-slate-400">Devuelto</dt><dd>${o.refunded ? "Sí" : "No"}</dd>
          <dt class="text-slate-400">ID</dt><dd class="font-mono text-[11px] text-slate-400 break-all">${escapeHtml(o.id)}</dd>
        </dl>
        ${hist.length ? `<div class="mt-4"><p class="label">Historial</p><ul class="text-xs space-y-1 text-slate-300">${hist.map((h) => `<li>${statusChip(normalizeStatus(h.status))} <span class="text-slate-400">${escapeHtml(fmtDT(h.at))} · ${escapeHtml(h.by || "")}</span></li>`).join("")}</ul></div>` : ""}
        <div class="mt-5 flex flex-wrap gap-2 justify-end">
          <button class="btn btn-ghost" data-act="modal-close">Cerrar</button>
          ${nexts.map((s) => `<button class="btn btn-success" data-act="order-set" data-id="${escapeHtml(o.id)}" data-status="${s}">${NEXT_LABEL[s]}</button>`).join("")}
          ${NEXT_STATUS[o.status].includes("RECHAZADO") ? `<button class="btn btn-danger" data-act="order-reject" data-id="${escapeHtml(o.id)}">Rechazar</button>` : ""}
        </div>`);
    }

    // ============================== EVENTOS (delegación) ==============================
    async function doOrderStatus(id, status) {
      if (uiState.busy) return; uiState.busy = true;
      const res = await orderStatusOp({ session: getCurrentSession(), orderId: id, newStatus: status });
      uiState.busy = false;
      if (!res.ok) return showToast(res.error, "error");
      if (uiState.popups.delete(id)) renderPopups();
      closeModal();
      showToast(status === "RECHAZADO" ? "Pedido rechazado y monedas devueltas al asesor." : `Pedido: ${ORDER_STATUS[status]}.`, "success");
      if (cloudOn()) await cloudUpsertLocalMirror(); requestRender(0);
    }
    async function cloudUpsertLocalMirror() { /* los snapshots de Firestore actualizan el espejo local */ }

    document.addEventListener("click", async (e) => {
      if (e.target.id === "modal-root") return closeModal();
      const el = e.target.closest("[data-act]"); if (!el) return;
      const d = el.dataset, session = getCurrentSession();
      switch (d.act) {
        case "auth-tab": uiState.authTab = d.tab; return renderApp();
        case "rank-group": uiState.rankGroup = d.group; return refreshLight();
        case "logout": clearSession(); uiState.revealedPasswords.clear(); uiState.popups.clear(); renderPopups(); uiState.advTab = "wallet"; uiState.adminTab = "orders"; uiState.trRecipient = null; showToast("Sesión cerrada.", "info"); return renderApp();
        case "bell": uiState.adminTab = "orders"; uiState.orderFilter = "PENDIENTE"; return renderApp();
        case "adv-tab": uiState.advTab = d.tab; return renderApp();
        case "adm-tab": uiState.adminTab = d.tab; return renderApp();
        case "modal-close": return closeModal();
        case "popup-close": uiState.popups.delete(d.id); return renderPopups();
        case "tr-pick": { uiState.trRecipient = d.id; const me = getAdvisors().find((a) => a.id === session?.id); const l = document.getElementById("tr-list"); if (l && me) l.innerHTML = trListHtml(me); return; }

        case "redeem-open": {
          const me = getAdvisors().find((a) => a.id === session?.id), p = getProducts().find((x) => x.id === d.id); if (!me || !p) return;
          if (!p.price) return showToast("Este producto aún no tiene precio.", "warning");
          uiState.pending = { kind: "redeem", productId: p.id, requestId: generateId("rq") };
          const bal = Number(me.balance) || 0;
          return openModal(`
            <h3 class="text-base font-extrabold text-white">Confirmar canje</h3>
            <img src="${escapeHtml(productImg(p))}" alt="" class="w-full aspect-[5/3] object-cover rounded-xl mt-3" />
            <p class="mt-3 text-sm font-bold text-white">${escapeHtml(p.name)}</p>
            <div class="mt-2 tile p-3 text-sm space-y-1">
              <div class="flex justify-between"><span class="text-slate-400">Precio</span><strong class="text-emerald-300">${escapeHtml(formatVc(p.price))}</strong></div>
              <div class="flex justify-between"><span class="text-slate-400">Tu saldo</span><span>${escapeHtml(formatVc(bal))}</span></div>
              <div class="flex justify-between border-t border-slate-700 pt-1"><span class="text-slate-400">Saldo después</span><strong>${escapeHtml(formatVc(bal - p.price))}</strong></div>
            </div>
            <div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-success" data-act="redeem-confirm">Confirmar canje</button></div>`);
        }
        case "redeem-confirm": {
          const p = uiState.pending; if (!p || p.kind !== "redeem" || uiState.busy) return; uiState.busy = true; el.disabled = true; el.textContent = "Procesando…";
          const res = await redeemOp({ session, productId: p.productId, requestId: p.requestId }); uiState.busy = false;
          if (!res.ok) { closeModal(); return showToast(res.error, "error"); }
          uiState.pending = null; uiState.advTab = "orders";
          openModal(`<div class="text-center"><div class="text-5xl">⏳</div><h3 class="mt-2 text-base font-extrabold text-amber-300">${escapeHtml(PENDING_MESSAGE.split("! ")[0])}!</h3><p class="mt-2 text-sm text-slate-200">${escapeHtml(PENDING_MESSAGE.split("! ")[1])}.</p><p class="mt-3 text-xs text-slate-400">Nuevo saldo: ${escapeHtml(formatVc(res.newBalance))}</p><button class="btn btn-primary w-full mt-5" data-act="modal-close">Ver mis pedidos</button></div>`);
          return requestRender(0);
        }
        case "transfer-confirm": {
          const p = uiState.pending; if (!p || p.kind !== "transfer" || uiState.busy) return; uiState.busy = true; el.disabled = true; el.textContent = "Enviando…";
          const res = await transferOp({ session, recipientId: p.recipientId, amount: p.amount, note: p.note, requestId: p.requestId }); uiState.busy = false;
          closeModal();
          if (!res.ok) return showToast(res.error, "error");
          uiState.trRecipient = null; uiState.trSearch = ""; uiState.advTab = "wallet";
          showToast(`Enviaste ${formatVc(res.tx.amount)} a ${res.tx.recipientName}.`, "success");
          return requestRender(0);
        }

        case "order-view": return orderDetailModal(d.id);
        case "order-filter": uiState.orderFilter = d.status; return renderApp();
        case "order-set": return doOrderStatus(d.id, d.status);
        case "order-reject": {
          const o = getOrders().find((x) => x.id === d.id); if (!o) return;
          return openModal(`<h3 class="text-base font-extrabold text-white">Rechazar pedido</h3><p class="mt-2 text-sm text-slate-300">Se rechazará el pedido de <strong>${escapeHtml(o.advisorName)}</strong> (${escapeHtml(o.productName)}) y se devolverán <strong class="text-emerald-300">${escapeHtml(formatVc(o.costVc))}</strong> a su billetera. Esta devolución se hace una sola vez.</p><div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-danger" data-act="order-set" data-id="${escapeHtml(o.id)}" data-status="RECHAZADO">Sí, rechazar y devolver</button></div>`);
        }

        case "grp-filter": uiState.adminFilterGroup = uiState.adminFilterGroup === d.group ? "ALL" : d.group; uiState.adminPage = 1; return renderApp();
        case "toggle-pass": uiState.revealedPasswords.has(d.id) ? uiState.revealedPasswords.delete(d.id) : uiState.revealedPasswords.add(d.id); { const t = document.getElementById("adv-table-root"); if (t) t.innerHTML = advisorsTableHtml(); } return;
        case "adm-prev": if (uiState.adminPage > 1) uiState.adminPage--; { const t = document.getElementById("adv-table-root"); if (t) t.innerHTML = advisorsTableHtml(); } return;
        case "adm-next": uiState.adminPage++; { const t = document.getElementById("adv-table-root"); if (t) t.innerHTML = advisorsTableHtml(); } return;
        case "adj-open": {
          const a = getAdvisors().find((x) => x.id === d.id); if (!a) return;
          uiState.pending = { kind: "adjust", advisorId: a.id, requestId: generateId("rq") };
          return openModal(`<h3 class="text-base font-extrabold text-white">Ajustar saldo</h3><p class="text-sm text-slate-300 mt-1">${escapeHtml(a.name)} · saldo actual <strong class="text-emerald-300">${escapeHtml(formatVc(a.balance))}</strong></p><div class="mt-4 space-y-3"><div><label class="label">Nuevo saldo</label><input id="adj-value" type="number" min="0" step="1" class="input" value="${escapeHtml(a.balance)}" /></div><div><label class="label">Motivo</label><input id="adj-reason" type="text" class="input" placeholder="Ej. Corrección de saldo" /></div></div><div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-primary" data-act="adj-confirm">Guardar ajuste</button></div>`);
        }
        case "adj-confirm": {
          const p = uiState.pending; if (!p || p.kind !== "adjust" || uiState.busy) return; uiState.busy = true;
          const res = await adjustOp({ session, advisorId: p.advisorId, newBalance: document.getElementById("adj-value")?.value, reason: document.getElementById("adj-reason")?.value, requestId: p.requestId }); uiState.busy = false;
          if (!res.ok) return showToast(res.error, "error");
          closeModal(); showToast("Saldo actualizado y registrado.", "success"); return requestRender(0);
        }
        case "del-open": {
          const a = getAdvisors().find((x) => x.id === d.id); if (!a) return;
          uiState.pending = { kind: "delete", advisorId: a.id };
          return openModal(`<h3 class="text-base font-extrabold text-white">Eliminar cuenta</h3><p class="mt-2 text-sm text-slate-300">¿Eliminar la cuenta de <strong>${escapeHtml(a.name)}</strong>? Dejará de poder iniciar sesión. Su historial de movimientos y pedidos se conserva.</p><div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-danger" data-act="del-confirm">Sí, eliminar</button></div>`);
        }
        case "del-confirm": {
          const p = uiState.pending; if (!p || p.kind !== "delete") return;
          const res = await deleteAdvisorOp({ session, advisorId: p.advisorId });
          closeModal(); if (!res.ok) return showToast(res.error, "error");
          showToast(`Cuenta de ${res.name} eliminada.`, "success"); return requestRender(0);
        }
      }
    });

    document.addEventListener("submit", async (e) => {
      const f = e.target.closest("form[data-form]"); if (!f) return;
      e.preventDefault();
      const kind = f.dataset.form, session = getCurrentSession(), fd = new FormData(f);
      if (kind === "login") {
        const res = loginUser(document.getElementById("login-email")?.value, document.getElementById("login-password")?.value);
        if (!res.ok) return showToast(res.error, "error");
        showToast(`Bienvenido, ${res.user.name}.`, "success"); return renderApp();
      }
      if (kind === "register") {
        const res = registerAdvisorAccount({ name: document.getElementById("reg-name")?.value, username: document.getElementById("reg-username")?.value, role: document.getElementById("reg-role")?.value, password: document.getElementById("reg-password")?.value });
        if (!res.ok) return showToast(res.error, "error");
        showToast(`Cuenta creada para ${res.advisor.name}.`, "success"); return renderApp();
      }
      if (kind === "transfer") {
        const me = getAdvisors().find((a) => a.id === session?.id), rec = getAdvisors().find((a) => a.id === uiState.trRecipient);
        if (!me) return; if (!rec) return showToast("Selecciona al asesor destinatario.", "warning");
        const amt = toPositiveInt(fd.get("amount")); if (!amt) return showToast("Ingresa una cantidad válida.", "error");
        if (amt > (Number(me.balance) || 0)) return showToast(`Saldo insuficiente. Tienes ${formatVc(me.balance)}.`, "error");
        uiState.pending = { kind: "transfer", recipientId: rec.id, amount: amt, note: String(fd.get("note") || ""), requestId: generateId("rq") };
        return openModal(`<h3 class="text-base font-extrabold text-white">Confirmar transferencia</h3><div class="mt-3 tile p-4 text-sm space-y-1.5"><div class="flex justify-between"><span class="text-slate-400">Para</span><strong>${escapeHtml(rec.name)}</strong></div><div class="flex justify-between"><span class="text-slate-400">Grupo</span><span>${escapeHtml(groupShort(rec.role))}</span></div><div class="flex justify-between"><span class="text-slate-400">Cantidad</span><strong class="text-amber-300">${escapeHtml(formatVc(amt))}</strong></div><div class="flex justify-between border-t border-slate-700 pt-1.5"><span class="text-slate-400">Tu saldo después</span><span>${escapeHtml(formatVc((Number(me.balance) || 0) - amt))}</span></div></div><div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-primary" data-act="transfer-confirm">Enviar ahora</button></div>`);
      }
      if (kind === "grant") {
        if (uiState.busy) return; uiState.busy = true;
        const res = await grantOp({ session, advisorId: fd.get("advisor"), amount: fd.get("amount"), note: fd.get("note"), requestId: generateId("rq") }); uiState.busy = false;
        if (!res.ok) return showToast(res.error, "error");
        showToast(`Enviados ${formatVc(res.tx.amount)} a ${res.tx.recipientName}.`, "success"); return requestRender(0);
      }
      if (kind === "product") {
        if (uiState.busy) return; uiState.busy = true; const id = f.dataset.id;
        const res = await saveProductOp({ session, id, name: fd.get("name"), priceRaw: fd.get("price"), stockRaw: fd.get("stock"), active: fd.get("active") !== null, imageData: uiState.pendingImages[id] });
        uiState.busy = false;
        if (!res.ok) return showToast(res.error, "error");
        delete uiState.pendingImages[id]; showToast("Producto guardado.", "success"); return requestRender(0);
      }
    });

    document.addEventListener("input", (e) => {
      if (e.target.id === "tr-search") { uiState.trSearch = e.target.value; const s = getCurrentSession(); const me = getAdvisors().find((a) => a.id === s?.id); const l = document.getElementById("tr-list"); if (l && me) l.innerHTML = trListHtml(me); }
      if (e.target.id === "admin-search") { uiState.adminSearch = e.target.value; uiState.adminPage = 1; const t = document.getElementById("adv-table-root"); if (t) t.innerHTML = advisorsTableHtml(); }
    });
    document.addEventListener("change", async (e) => {
      const t = e.target;
      if (t.id === "admin-filter-group") { uiState.adminFilterGroup = t.value; uiState.adminPage = 1; const el = document.getElementById("adv-table-root"); if (el) el.innerHTML = advisorsTableHtml(); }
      if (t.id === "mov-filter") { uiState.movFilter = t.value; renderApp(); }
      if (t.dataset && t.dataset.imageFor && t.files && t.files[0]) {
        try { const data = await resizeImageFile(t.files[0]); uiState.pendingImages[t.dataset.imageFor] = data; const img = document.getElementById(`prod-img-${t.dataset.imageFor}`); if (img) img.src = data; showToast("Imagen lista. Pulsa Guardar para aplicarla.", "info"); }
        catch (err) { showToast(err.message, "error"); }
      }
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalOpen()) closeModal(); });

    getProducts(); // asegura catálogo inicial local (sin precios)
    renderApp();
    initFirebaseAndAuth();
  </script>
</body>
</html>
